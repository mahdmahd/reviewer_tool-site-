<!doctype html>
<html lang="en" data-grid="on">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlatyPeer</title>
<meta name="description" content="A working instrument for reviewing healthcare-AI papers. Line-anchored notes, a two-read triage, an appraisal table, and a submittable report." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/platypeer_logo.png" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet">
<script data-goatcounter="https://iaimsreviewtool2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
/* ============================================================
   PlatyPeer — construction-grid world
   Measure first. The lattice is the instrument.
   ============================================================ */
:root{
  /* ink and paper — light chosen for the scene: a lit desk, daytime,
     a printed manuscript beside the screen */
  --paper:#F4F4F1;
  --paper-2:#EBEBE6;
  --card:#FAFAF7;
  --ink:#14171A;
  --ink-2:#43474C;
  --ink-3:#6B7075;
  --rule:#D3D6D0;
  --hair:#E3E5E0;
  --rule-strong:#14171A;

  /* the committed plane. Structure only. */
  --ultra:#1B2FD0;
  --ultra-ink:#0E1A80;
  --ultra-wash:#E8EAFB;

  /* signal. Severity and nothing else. Never alone. */
  --major:#C8361F;
  --major-wash:#FBEDEA;
  --minor:#9A6B00;
  --minor-wash:#FBF3E0;
  --ai:#5B3E9B;
  --ok:#1F6B45;

  --f-display:'Anybody',ui-sans-serif,system-ui,sans-serif;
  --f-text:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --mod:28px;                     /* the construction module */
  --gut:clamp(16px,3.2vw,40px);
  --maxw:1460px;
  --rail:132px;

  --t-fast:120ms;
  --t:220ms;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-text);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-synthesis-weight:none;
  caret-color:var(--ultra);
}
/* --- the armature: always drawn, toggleable as a real state --- */
.lattice{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right,var(--hair) 0 1px,transparent 1px var(--mod)),
    repeating-linear-gradient(to bottom,var(--hair) 0 1px,transparent 1px var(--mod));
  opacity:.6;transition:opacity var(--t) var(--ease);
}
html[data-grid="off"] .lattice{opacity:0}

/* --- browser surfaces, themed from the palette --- */
::selection{background:var(--ultra);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--paper-2)}
::-webkit-scrollbar-thumb{background:var(--rule);border:3px solid var(--paper-2)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
*{scrollbar-color:var(--rule) var(--paper-2);scrollbar-width:thin}
:focus-visible{outline:2px solid var(--ultra);outline-offset:2px}
a{color:var(--ultra-ink);text-underline-offset:3px;text-decoration-thickness:1px}

.wrap{position:relative;z-index:1;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.skip{position:absolute;left:var(--gut);top:-80px;z-index:80;background:var(--ink);color:var(--paper);padding:12px 18px;font-family:var(--f-mono);font-size:13px}
.skip:focus{top:8px}

/* ============================ masthead ============================ */
.masthead{border-bottom:1px solid var(--rule-strong);padding-top:22px}
.masthead .wrap{display:flex;align-items:flex-end;gap:clamp(16px,3vw,40px);flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:13px;flex:none}
.brand-logo{width:58px;height:58px;flex:none;display:block;object-fit:contain}
.brand-name{font-family:var(--f-display);font-size:26px;font-weight:800;font-variation-settings:'wdth' 112;letter-spacing:-.02em;line-height:.9}
.brand-sub{font-family:var(--f-text);font-size:11px;font-weight:500;letter-spacing:.11em;color:var(--ink-3);margin-top:3px}

.msfield{flex:1 1 380px;min-width:240px;display:flex;flex-direction:column;gap:6px}
.msfield label{font-family:var(--f-text);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.msfield input{
  font-family:var(--f-text);font-size:19px;font-weight:600;color:var(--ink);
  background:transparent;border:0;border-bottom:2px solid var(--rule-strong);
  padding:6px 0 7px;width:100%;transition:border-color var(--t-fast) linear;
}
.msfield input::placeholder{color:var(--ink-3);font-weight:400;font-size:15.5px}
.msfield input:focus{outline:0;border-bottom-color:var(--ultra)}

.savestate{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:7px;padding-bottom:4px;white-space:nowrap}
.savestate .dot{width:6px;height:6px;background:var(--ok);flex:none}

/* --- the reading: counters as measurement figures --- */
.reading{
  border-bottom:1px solid var(--rule);
  background:var(--paper);
}
.reading .wrap{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;padding-block:6px 2px}
.counter{
  display:flex;align-items:baseline;gap:9px;
  padding:12px 20px 12px 0;margin-right:20px;
  border-right:1px solid var(--rule);flex:none;
}
.counter:last-of-type{border-right:0}
.counter .n{
  font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:23px;font-weight:600;line-height:1;letter-spacing:-.02em;
}
.counter .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.counter[data-sig="major"] .n{color:var(--major)}
.counter[data-sig="minor"] .n{color:var(--minor)}
.counter.is-zero .n{color:var(--ink-3)}
.reading .spacer{flex:1 1 auto;min-width:8px}
.reading .tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding-block:6px}
.reading .tools button{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
  background:transparent;border:0;color:var(--ink-2);padding:9px 11px;cursor:pointer;
  transition:color var(--t-fast) linear,background var(--t-fast) linear;
}
.reading .tools button:hover{background:var(--paper-2);color:var(--ink)}
.reading .tools button[aria-pressed="true"]{background:var(--ultra);color:#fff}

/* ============================ armature ============================ */
.armature{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:0;align-items:start;padding-block:0}

.rail{position:sticky;top:0;border-right:1px solid var(--rule);padding-block:20px 200px;min-height:60vh}
.rail-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rail-list li{position:relative}
.rail-btn{
  display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:11px;
  width:100%;background:transparent;border:0;cursor:pointer;text-align:left;
  padding:0 14px 0 0;margin-bottom:2px;color:var(--ink-2);
  transition:color var(--t-fast) linear;
}
.rail-num{
  width:40px;height:40px;display:grid;place-items:center;flex:none;
  font-family:var(--f-mono);font-size:13px;font-weight:500;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-3);
  transition:background var(--t-fast) linear,color var(--t-fast) linear,border-color var(--t-fast) linear;
}
.rail-lab{font-size:12.5px;font-weight:500;letter-spacing:-.005em;line-height:1.2;padding-block:6px}
.rail-btn:hover{color:var(--ink)}
.rail-btn:hover .rail-num{border-color:var(--ink-3)}
.rail-btn[aria-current="true"]{color:var(--ink);font-weight:600}
.rail-btn[aria-current="true"] .rail-num{background:var(--ultra);border-color:var(--ultra);color:#fff}
.rail-btn[aria-current="true"] .rail-lab{font-weight:600}
.rail-btn.is-done .rail-num{border-color:var(--ink);color:var(--ink)}
.rail-opt{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;display:block;margin-top:2px}
.rail-foot{position:absolute;bottom:20px;left:0;right:14px}
.rail-foot button{
  width:100%;font-family:var(--f-text);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:1px solid var(--rule);color:var(--ink-3);padding:9px;cursor:pointer;
  transition:all var(--t-fast) linear;
}
.rail-foot button:hover{border-color:var(--ink);color:var(--ink)}
.rail-foot button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.field{padding:clamp(18px,2.6vw,32px) clamp(16px,3vw,40px) 80px;min-width:0}

/* --- field head: monument numeral + title --- */
.head{display:flex;align-items:flex-start;gap:clamp(14px,2.4vw,30px);border-bottom:1px solid var(--rule-strong);padding-bottom:16px;margin-bottom:26px;flex-wrap:wrap}
.head-num{
  font-family:var(--f-display);font-size:clamp(58px,8.6vw,96px);font-weight:800;line-height:.76;
  font-variation-settings:'wdth' 68;letter-spacing:0;color:var(--ink);flex:none;
}
.head-txt{flex:1 1 300px;min-width:0;padding-top:6px}
.head-title{font-family:var(--f-display);font-size:clamp(21px,2.5vw,29px);font-weight:700;font-variation-settings:'wdth' 100;letter-spacing:-.025em;line-height:1.08;margin:0 0 7px}
.head-desc{margin:0;color:var(--ink-2);max-width:66ch;font-size:14.5px}

/* --- the note, one schema, everywhere --- */
.note{
  background:var(--card);border:0;border-bottom:1px solid var(--rule);
  padding:11px 0 11px 0;display:grid;grid-template-columns:106px minmax(0,1fr);gap:0;
  transition:background var(--t-fast) linear;
}
.note:first-child{border-top:1px solid var(--rule)}
.note-schema{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-3);
  border-right:1px solid var(--hair);padding:3px 12px 3px 11px;display:flex;flex-direction:column;gap:5px;
}
.note-line{font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.note-sec{text-transform:uppercase;letter-spacing:.03em;font-size:9.5px;line-height:1.35}
.note-body{padding-left:14px;min-width:0}
.note-text{margin:0;font-size:15px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.note-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.sevtag{
  font-family:var(--f-mono);font-weight:700;font-size:9.5px;font-weight:600;letter-spacing:.1em;
  padding:2px 6px;border:1px solid currentColor;text-transform:uppercase;
}
.sevtag[data-s="major"]{color:#fff;background:var(--major);border-color:var(--major)}
.sevtag[data-s="minor"]{color:#fff;background:var(--minor);border-color:var(--minor)}
.sevtag[data-s="none"]{color:var(--ink-3);background:transparent}
.note.n-major{background:var(--major-wash)}
.note.n-minor{background:var(--minor-wash)}
.note.is-rejected{opacity:.5}
.note.is-rejected .note-text{text-decoration:line-through;text-decoration-color:var(--minor);text-decoration-thickness:2px}
.tagset{display:flex;gap:4px;flex-wrap:wrap}
.tagset .tag{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  padding:3px 7px;cursor:pointer;transition:all var(--t-fast) linear;
}
.tagset .tag:hover{border-color:var(--ink-3)}
.tagset .tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.note-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.mark{
  font-family:var(--f-text);font-size:12px;font-weight:500;letter-spacing:.01em;text-transform:uppercase;
  background:transparent;border:1px solid var(--rule);color:var(--ink-2);
  padding:5px 9px;cursor:pointer;transition:all var(--t-fast) linear;
}
.mark:hover{border-color:var(--ink);color:var(--ink)}
.mark[aria-pressed="true"]{background:var(--ultra);border-color:var(--ultra);color:#fff}
.mark.m-rej[aria-pressed="true"]{background:var(--minor);border-color:var(--minor);color:#fff}
.editbox{
  width:100%;font-family:var(--f-text);font-size:15px;line-height:1.5;color:var(--ink);
  background:#fff;border:1px solid var(--ultra);padding:8px 10px;resize:vertical;
}
.editbox:focus{outline:2px solid var(--ultra-wash)}

/* --- capture form --- */
.capture{border:1px solid var(--rule-strong);background:var(--card);padding:16px;margin-bottom:20px}
.capture-row{display:grid;grid-template-columns:88px 1fr;gap:12px;margin-bottom:11px}
.capture-row.full{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-family:var(--f-text);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.inp,select.inp,textarea.inp{
  font-family:var(--f-text);font-size:14.5px;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);padding:8px 10px;width:100%;
  transition:border-color var(--t-fast) linear;
}
.inp:focus{outline:2px solid var(--ultra-wash);outline-offset:0;border-color:var(--ultra)}
textarea.inp{resize:vertical;line-height:1.5;font-family:var(--f-text)}
select.inp{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

.btn{
  font-family:var(--f-text);font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  border:1px solid var(--ink);background:var(--ultra);color:#fff;
  padding:10px 18px;cursor:pointer;transition:all var(--t-fast) linear;white-space:nowrap;
}
.btn:hover{background:var(--ultra-ink);border-color:var(--ultra-ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--rule);border-color:var(--rule);color:var(--ink-3);cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.sec:hover{background:var(--paper-2);border-color:var(--ink)}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-2);padding:10px 10px}
.btn.gh:hover{background:var(--paper-2);color:var(--ink)}
.btn.sm{font-size:12px;padding:7px 13px}

/* --- overview figures --- */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));border:1px solid var(--rule-strong);border-right:0;border-bottom:0;margin-bottom:22px;background:var(--card)}
.fig{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 14px}
.fig .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em}
.fig .l{font-family:var(--f-text);font-weight:500;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.fig[data-s="major"]{background:var(--major-wash)}.fig[data-s="major"] .n{color:var(--major)}
.fig[data-s="minor"]{background:var(--minor-wash)}.fig[data-s="minor"] .n{color:var(--minor)}

/* --- control strip (filters / tag maker) --- */
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border:1px solid var(--rule);background:var(--card);padding:13px 14px;margin-bottom:20px}
.strip .f{flex:1 1 180px}
.strip .f.narrow{flex:0 1 130px}

/* --- the appraisal instrument: an item table, not a card list --- */
.table{border:1px solid var(--rule-strong);border-bottom:0;background:var(--card)}
.trow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;border-bottom:1px solid var(--rule);transition:background var(--t-fast) linear}
.trow:first-child{border-top:0}
.trow[data-sev="major"] .tcell-code{color:var(--major)}
.trow[data-sev="minor"] .tcell-code{color:var(--minor)}
.trow.is-flagged{background:var(--major-wash)}
.trow.is-flagged[data-sev="minor"]{background:var(--minor-wash)}
.tcell-code{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--ink-3);
  border-right:1px solid var(--hair);padding:12px 10px;line-height:1.3;
}
.tcell-code b{display:block;color:var(--ink);font-weight:600;font-size:11.5px;letter-spacing:0}
.tcell-body{padding:12px 14px 13px;min-width:0}
.tcell-body .q{font-size:15px;font-weight:500;margin:0 0 4px;line-height:1.4}
.tcell-body .hint{margin:0;font-size:13px;color:var(--ink-3);line-height:1.45}
.tcell-body .src{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-3);margin:6px 0 0}
.tcell-body input.note-in{
  font-family:var(--f-text);font-size:13.5px;background:var(--paper);border:1px solid var(--rule);
  padding:6px 9px;width:100%;margin-top:9px;color:var(--ink);
}
.tcell-body input.note-in:focus{outline:2px solid var(--ultra-wash);outline-offset:0;border-color:var(--ultra)}
.tcell-ans{display:flex;border-left:1px solid var(--hair);align-items:stretch}
.tcell-ans button{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:0;border-left:1px solid var(--hair);color:var(--ink-2);
  padding:0 13px;cursor:pointer;transition:all var(--t-fast) linear;min-width:66px;
}
.tcell-ans button:first-child{border-left:0}
.tcell-ans button:hover{background:var(--paper-2);color:var(--ink)}
.tcell-ans button[aria-pressed="true"][data-v="yes"]{background:var(--ok);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="no"]{background:var(--major);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="unclear"]{background:var(--minor);color:#fff}
.thead{
  display:grid;grid-template-columns:62px minmax(0,1fr) auto;border-bottom:1px solid var(--rule-strong);
  background:var(--ink);
}
.thead span{font-family:var(--f-text);font-weight:600;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--paper);padding:8px 12px}
.thead span:last-child{border-left:1px solid #33383d;min-width:230px}

/* --- the output sheet --- */
.sheet{
  background:#fff;border:1px solid var(--rule);
  outline:1px solid var(--rule);outline-offset:5px;
  padding:0 0 34px;margin-bottom:32px;
}
.sheet-band{background:var(--ultra);color:#fff;padding:11px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sheet-band .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.sheet-band .m{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;opacity:.85}
.sheet-in{padding:26px 24px 0}
.rep-sheet-title{font-family:var(--f-display);font-size:clamp(23px,3vw,32px);font-weight:700;font-variation-settings:'wdth' 92;letter-spacing:-.03em;margin:0 0 4px}
.rep-ms{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.rsect{margin-bottom:24px}
.rsect-h{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 0;padding:6px 10px;background:var(--paper-2);border-bottom:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.rsect-h[data-s="major"]{background:var(--major-wash);border-bottom-color:var(--major);color:var(--major)}
.rsect-h[data-s="minor"]{background:var(--minor-wash);border-bottom-color:var(--minor);color:var(--minor)}
.rsub{
  font-family:var(--f-text);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--hair);
}
.rline{display:grid;grid-template-columns:106px minmax(0,1fr) auto;gap:0;border-bottom:1px solid var(--hair);align-items:start}
.rline:last-child{border-bottom:0}
.rline-l{
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);padding:9px 10px 9px 11px;
  border-right:1px solid var(--hair);font-variant-numeric:tabular-nums;
}
.rline-l b{color:var(--ink);font-weight:600;display:block;font-size:11.5px}
.rline-v{padding:9px 12px;font-size:14px;line-height:1.55;overflow-wrap:anywhere;cursor:text}
.rline-v:hover{background:var(--ultra-wash)}
.rline-v[contenteditable="true"]{background:#fff;outline:2px solid var(--ultra)}
.rline.is-ai{background:#FBFAFE}
.rline.is-ai .rline-l b{color:var(--ai)}
.rline-x{
  background:transparent;border:0;color:var(--ink-3);cursor:pointer;padding:9px 10px;
  font-family:var(--f-mono);font-size:14px;line-height:1;opacity:0;transition:opacity var(--t-fast) linear,color var(--t-fast) linear;
}
.rline:hover .rline-x{opacity:1}
.rline-x:hover{color:var(--major)}
.rempty{color:var(--ink-3)}
.addrow{
  width:100%;text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
  background:transparent;border:0;border-bottom:1px dashed var(--rule);color:var(--ink-3);
  padding:7px 10px;cursor:pointer;transition:all var(--t-fast) linear;
}
.addrow:hover{border-bottom-color:var(--ultra);color:var(--ultra);background:var(--ultra-wash)}
.passlist{font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--ok);padding:9px 0;border-bottom:1px solid var(--hair)}

.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--rule-strong);border-right:0;border-bottom:0;margin-top:20px;background:var(--card)}
.rec{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px;cursor:pointer;transition:background var(--t-fast) linear;position:relative}
.rec:hover{background:var(--paper-2)}
.rec input{position:absolute;opacity:0;pointer-events:none}
.rec-t{font-family:var(--f-display);font-size:16px;font-weight:700;font-variation-settings:'wdth' 100;letter-spacing:-.015em;display:block}
.rec-d{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;display:block;margin-top:5px}
.rec[data-checked="true"]{background:var(--ink)}
.rec[data-checked="true"] .rec-t{color:var(--paper)}
.rec[data-checked="true"] .rec-d{color:#9DA2A8}

/* --- polish stage --- */
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));border:1px solid var(--rule-strong);border-right:0;border-bottom:0;margin-bottom:22px;background:var(--card)}
.route{
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:16px 17px 18px;cursor:pointer;position:relative;transition:background var(--t-fast) linear;
}
.route:hover{background:var(--paper-2)}
.route input{position:absolute;opacity:0;pointer-events:none}
.route-k{font-family:var(--f-text);font-weight:600;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:7px}
.route-t{font-family:var(--f-display);font-size:18px;font-weight:700;font-variation-settings:'wdth' 100;letter-spacing:-.02em;display:block;margin-bottom:6px}
.route-d{font-size:13px;color:var(--ink-2);line-height:1.5;display:block}
.route[data-checked="true"]{background:var(--ultra-wash);outline:2px solid var(--ultra);outline-offset:-2px}
.route[data-checked="true"] .route-t{color:var(--ultra-ink)}

.note-blk{
  border:1px solid var(--rule);border-left:0;border-right:0;background:var(--card);
  padding:14px 16px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2);line-height:1.6;
}
.note-blk b{color:var(--ink)}
.privacy{
  border:1px solid var(--ok);background:#F1F7F3;padding:13px 15px;margin-bottom:18px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);
}
.privacy b{color:var(--ok);font-family:var(--f-text);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px}

.kv{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.pill-out{
  font-family:var(--f-mono);font-size:11px;padding:9px 11px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.pill-out .dot{width:7px;height:7px;background:var(--ink-3);flex:none}
.pill-out[data-st="ok"]{border-color:var(--ok);color:var(--ok)}.pill-out[data-st="ok"] .dot{background:var(--ok)}
.pill-out[data-st="err"]{border-color:var(--major);color:var(--major)}.pill-out[data-st="err"] .dot{background:var(--major)}
.pill-out[data-st="busy"]{border-color:var(--ultra);color:var(--ultra-ink)}.pill-out[data-st="busy"] .dot{background:var(--ultra);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.prompt-out{
  font-family:var(--f-mono);font-size:12px;line-height:1.65;color:var(--ink);
  background:var(--ink);color:#DDE1DC;border:0;padding:16px;width:100%;
  height:230px;resize:vertical;
}
.prompt-out:focus{outline:2px solid var(--ultra)}

.compare{display:grid;grid-template-columns:1fr;border:1px solid var(--rule-strong);margin-bottom:18px}
@media(min-width:900px){.compare{grid-template-columns:1fr 1fr}}
.cmp-col{border-bottom:1px solid var(--rule)}
@media(min-width:900px){.cmp-col{border-bottom:0}.cmp-col+.cmp-col{border-left:1px solid var(--rule-strong)}}
.cmp-h{
  font-family:var(--f-text);font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  padding:8px 13px;background:var(--paper-2);border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--ink-2);
}
.cmp-h[data-k="polished"]{background:var(--ultra);color:#fff;border-bottom-color:var(--ultra)}
.cmp-b{padding:14px 15px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-height:390px;overflow-y:auto;color:var(--ink)}
.cmp-h[data-k="polished"]+.cmp-b{background:#fff}
.marks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.marks span{font-family:var(--f-mono);font-size:11px}
.marks .up{color:var(--ok)}.marks .dn{color:var(--major)}

/* --- modal --- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 46%,transparent);backdrop-filter:blur(2px)}
.mcard{
  position:relative;background:var(--paper);border:1px solid var(--ink);
  max-width:600px;width:100%;max-height:86vh;overflow:auto;
  outline:1px solid var(--ink);outline-offset:5px;
}
.mhead{background:var(--ink);padding:12px 20px}
.mhead h2{font-family:var(--f-text);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);margin:0;font-weight:500}
.mbody{padding:22px 20px}
.macts{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px;flex-wrap:wrap}
.gloss{border-bottom:1px solid var(--hair);padding:11px 0}
.gloss-term{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.02em;margin:0 0 4px}
.gloss-def{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.gloss-list{max-height:48vh;overflow-y:auto;margin-top:14px;border-top:1px solid var(--rule)}

.empty{border:1px dashed var(--rule);padding:22px;color:var(--ink-3);font-size:14px;background:var(--card)}
.opt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.opt-head .nm{font-family:var(--f-display);font-size:17px;font-weight:700;font-variation-settings:'wdth' 100;letter-spacing:-.015em}
.opt-head .dc{font-family:var(--f-text);font-size:12px;color:var(--ink-3);letter-spacing:.01em}
.foot{
  border-top:1px solid var(--rule-strong);padding:16px 0 8px;margin-top:10px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;
}
.foot .meta{font-family:var(--f-text);font-size:12px;letter-spacing:.01em;color:var(--ink-3)}
.foot .acts{display:flex;gap:8px;flex-wrap:wrap}

/* --- invite choice: checked state takes the committed plane --- */
.tag[aria-checked="true"]{background:var(--ultra);border-color:var(--ultra);color:#fff}

/* --- AI Glossary: provenance violet, the prominent control in the strip --- */
.reading .tools #btn-gloss{
  background:var(--ai);border:1px solid var(--ai);color:#fff;
  font-family:var(--f-text);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  padding:9px 15px;margin-right:4px;
}
.reading .tools #btn-gloss:hover{background:#472F7C;border-color:#472F7C;color:#fff}

/* --- severity stamps in triage (severity acts carry severity colour) --- */
.mark.m-maj[aria-pressed="true"]{background:var(--major);border-color:var(--major);color:#fff}
.mark.m-min[aria-pressed="true"]{background:var(--minor);border-color:var(--minor);color:#fff}

/* --- paper-sections editor (first read): chips in one row, the tag grammar --- */
.secedit{border:1px solid var(--hair);background:var(--paper);padding:10px 12px 12px;margin-bottom:14px}
.secedit-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.secedit-h .h2{letter-spacing:.01em;text-transform:none;font-family:var(--f-text);font-size:11.5px;color:var(--ink-3)}
.seclist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.secchip{
  display:flex;align-items:stretch;border:1px solid var(--rule);background:var(--card);
  transition:border-color var(--t-fast) linear,background var(--t-fast) linear;
}
.secchip:hover{border-color:var(--ink-3)}
.secchip.drag-over{background:var(--ultra-wash);outline:1px solid var(--ultra);outline-offset:-1px}
.sechandle{color:var(--ink-3);display:grid;place-items:center;cursor:grab;padding:0 2px 0 7px}
.sechandle:active{cursor:grabbing}
.secname{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;color:var(--ink);background:transparent;
  border:0;padding:6px 6px 6px 4px;min-width:84px;max-width:240px;
}
.secname:hover{background:var(--paper-2)}
.secname:focus{background:#fff;outline:2px solid var(--ultra-wash);outline-offset:-2px}
.secbtn{
  background:transparent;border:0;border-left:1px solid var(--hair);color:var(--ink-2);
  padding:0 7px;cursor:pointer;display:grid;place-items:center;
  transition:all var(--t-fast) linear;
}
.secbtn:hover{color:var(--ink);background:var(--paper-2)}
.secbtn:focus-visible{outline:2px solid var(--ultra);outline-offset:-2px}
.secbtn:disabled{opacity:.35;cursor:not-allowed}
.secbtn svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.secadd{display:flex;gap:8px;margin-top:10px}
.secadd .inp{flex:1}

/* --- provider presets and API type (polish) --- */
.provs{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));border:1px solid var(--rule-strong);border-right:0;border-bottom:0;background:var(--card);margin-bottom:14px}
.prov{
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:transparent;padding:11px 8px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-family:var(--f-text);transition:background var(--t-fast) linear;
}
.prov:hover{background:var(--paper-2)}
.prov svg{width:22px;height:22px;fill:var(--ink-2);transition:fill var(--t-fast) linear}
.prov span{font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--ink-2)}
.prov[aria-checked="true"]{background:var(--ultra-wash);outline:2px solid var(--ultra);outline-offset:-2px}
.prov[aria-checked="true"] svg{fill:var(--ultra-ink)}
.prov[aria-checked="true"] span{color:var(--ultra-ink)}
.apitype{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.apitype-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.apitype .tag{cursor:default}
.apitype .tagset .tag{cursor:pointer}
.apitype-h{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;color:var(--ink-3);flex:1 1 180px;line-height:1.5}

/* --- AI scale answers, EQUATOR panel, Springer table, core concerns, reviews library --- */
.tcell-ans{flex-wrap:wrap;max-width:340px}
.tcell-ans button{min-height:44px}
.tcell-ans button[aria-pressed="true"][data-v="1"],
.tcell-ans button[aria-pressed="true"][data-v="2"]{background:var(--major);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="3"]{background:var(--minor);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="4"],
.tcell-ans button[aria-pressed="true"][data-v="5"]{background:var(--ok);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="unclear"]{background:var(--minor);color:#fff}
.tcell-ans button[aria-pressed="true"][data-v="na"]{background:var(--ink-3);color:#fff}
.eqpanel{border:1px solid var(--rule-strong);background:var(--card);padding:14px 16px;margin-bottom:18px}
.eqpanel h3{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.eqpanel p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.55}
.eqlinks{display:flex;gap:6px;flex-wrap:wrap}
.eqlinks a{font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);padding:5px 9px;text-decoration:none;color:var(--ultra-ink);background:var(--paper)}
.eqlinks a:hover{border-color:var(--ultra);background:var(--ultra-wash)}
.sn-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.sn-table th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:8px;border:1px solid var(--rule-strong);background:var(--ink);color:var(--paper)}
.sn-table td{padding:9px 10px;border:1px solid var(--rule);vertical-align:top;line-height:1.5;background:var(--card)}
.sn-table tr[data-lvl="green"] td:first-child{border-left:5px solid var(--ok)}
.sn-table tr[data-lvl="amber"] td:first-child{border-left:5px solid var(--minor)}
.sn-table tr[data-lvl="red"] td:first-child{border-left:5px solid var(--major)}
.corebtn[aria-pressed="true"]{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
.note.is-core{outline:2px solid var(--ink);outline-offset:-2px}
.note.is-core .note-text{font-weight:700}
.rline.is-core .rline-v{font-weight:700}
.revlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.revrow{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);background:var(--card);padding:10px 12px;flex-wrap:wrap}
.revrow .rm{flex:1 1 180px;min-width:0}
.revrow .rm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.revrow .rm span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.hist{font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--ink-2);max-height:180px;overflow:auto;border:1px solid var(--hair);background:var(--paper);padding:10px 12px;margin-top:10px}

@media(max-width:880px){
  .armature{grid-template-columns:1fr}
  .rail{position:static;border-right:0;border-bottom:1px solid var(--rule-strong);padding:14px 0 16px;min-height:0}
  .rail-list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail-btn{grid-template-columns:auto;padding:0}
  .rail-lab{display:none}
  .rail-foot{position:static;margin-top:12px;right:auto}
  .rail-foot button{width:auto;padding:8px 14px}
  .field{padding-bottom:56px}
  .head-num{font-size:52px}
  .note{grid-template-columns:92px minmax(0,1fr)}
  .trow,.thead{grid-template-columns:52px minmax(0,1fr)}
  .thead span:last-child,.tcell-ans{grid-column:1/-1;border-left:0;border-top:1px solid var(--hair)}
  .tcell-ans button{min-height:42px}
  .rline{grid-template-columns:92px minmax(0,1fr) auto}
}
@media print{
  @page{size:A4;margin:14mm 12mm}
  .lattice,.masthead,.reading,.rail,.foot,.addrow,.rline-x,.mod-skip,.letter-sect{display:none!important}
  .armature{grid-template-columns:1fr}
  .field{padding:0}
  .sheet{border:0;outline:none}
  .cmp-col{break-inside:avoid}
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div class="lattice" aria-hidden="true"></div>
<a class="skip" href="#field">Skip to the working field</a>

<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <img class="brand-logo" src="assets/platypeer_logo.png" alt="iAIMS" width="220" height="220">
      <div>
        <div class="brand-name">PlatyPeer</div>
        <div class="brand-sub">An iAIMS tool</div>
      </div>
    </div>
    <a class="btn gh sm" href="index.html" title="Back to the landing page">← Home</a>
    <div class="msfield">
      <label for="ms">Manuscript</label>
      <input id="ms" type="text" placeholder="Identifier, first author, or working title" autocomplete="off" spellcheck="false" />
    </div>
    <div class="savestate" id="savestate"><span class="dot"></span><span id="savetext">Saved</span></div>
  </div>
</header>

<div class="reading">
  <div class="wrap">
    <div class="counter is-zero" id="c-untagged"><span class="n">0</span><span class="l">Untagged</span></div>
    <div class="counter is-zero" id="c-major" data-sig="major"><span class="n">0</span><span class="l">Major</span></div>
    <div class="counter is-zero" id="c-minor" data-sig="minor"><span class="n">0</span><span class="l">Minor</span></div>
    <div class="spacer"></div>
    <div class="tools">
      <button type="button" id="btn-gloss">AI Glossary<span aria-hidden="true"> ↗</span></button>
      <button type="button" id="btn-new" title="Start a new review">＋ New</button>
      <button type="button" id="btn-open" title="Continue a saved review">My reviews</button>
      <button type="button" id="btn-export" title="Save this review as a .pltpy file">Export .pltpy</button>
      <button type="button" id="btn-import" title="Continue a review from a .pltpy file">Import .pltpy</button>
      <input type="file" id="file-import" accept=".pltpy,.md,.txt" hidden />
    </div>
  </div>
</div>

<main class="wrap">
  <div class="armature">
    <nav class="rail" aria-label="Review steps">
      <ol class="rail-list" id="raillist"></ol>
      <div class="rail-foot">
        <button type="button" id="btn-reset">Clear review</button>

  </div>
</main>

<footer class="wrap">
  <div class="foot">
    <p class="meta" id="footmeta">Readings stay in this browser. Nothing is uploaded.</p>
    <div class="acts">
      <button type="button" class="btn gh sm" id="btn-prev">Back</button>
      <button type="button" class="btn sm" id="btn-next">Continue</button>
    </div>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="scrim" data-close></div>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mhead"><h2 id="mtitle">Notice</h2></div>
    <div class="mbody" id="mbody"></div>
    <div class="macts">
      <button type="button" class="btn sec sm" id="mcancel">Cancel</button>
      <button type="button" class="btn sm" id="mconfirm">Confirm</button>
    </div>
  </div>
</div>

<script>
(()=>{
"use strict";
const KEY="iaims-review-v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid=()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---- the six stations ---- */
const STEPS=[
 {n:1,k:"01",label:"Invite",desc:"Ask yourself three easy questions to decide whether you should accept this peer review: expertise, conflicts of interest and time."},
 {n:2,k:"02",label:"First read",desc:"Read the manuscript entirely and jot down anything that comes to mind — don't worry about wording, severity, or what makes the final letter. A reading with no line number is labelled General, so give a line number whenever the manuscript has one."},
 {n:3,k:"03",label:"Second read",desc:"Read the manuscript again after having detached from it (e.g. the next day). Filter your initial notes, add new ones, rewrite what you keep, and label each reading Major or Minor. Strike what doesn't belong. Tags (＋ Mark) are optional — they help the AI polish later."},
 {n:4,k:"04",label:"AI Checklist",optional:true,desc:"Are you reviewing a paper involving AI in healthcare? This optional step contains a list of questions, based on EQUATOR checklists, that aims to filter out major flaws in AI methodology and reporting."},
 {n:5,k:"05",label:"Report",desc:"View your entire report as it will appear as PDF. Make final adaptations, or choose for AI polishing in step 6."},
 {n:6,k:"06",label:"AI polishing",optional:true,desc:"If you would like to have your text refined with the help of AI, provide your own model key — or generate a prompt for you to copy into your favourite chat app."}
];
const SECTIONS=["Introduction","Methods","Results","Discussion","Figures","Tables"];
const LEGACY_SECTIONS=["Introduction","Methods","Results","Discussion","General"];
const LEGACY_SECTIONS2=["Introduction","Methods","Results","Discussion"];
const PRE_TAGS=[
 {name:"typo",sev:"minor"},{name:"grammar / language",sev:"minor"},{name:"formatting",sev:"minor"},
 {name:"reference style",sev:"minor"},{name:"figure / table clarity",sev:"minor"},
 {name:"methodological concern",sev:"major"},{name:"statistical issue",sev:"major"},
 {name:"data concern",sev:"major"},{name:"interpretation overreach",sev:"major"},
 {name:"novelty / originality",sev:"major"},{name:"ethics",sev:"major"}

function aiSecOf(t){

}

function moveSec(i,d){const a=S.sections;const j=i+d;if(j<0||j>=a.length)return;const t=a[i];a[i]=a[j];a[j]=t;save();render();}
function delSec(i){
  if(S.sections.length<2)return;
  const removed=S.sections[i];
  const fb=S.sections.includes("General")?"General":(S.sections[i+1]||S.sections[i-1]);
  S.notes.forEach(n=>{if(n.section===removed)n.section=fb;});
  S.sections.splice(i,1);save();render();
}
function renameSec(i,v){
  const old=S.sections[i],nv=String(v||"").trim();
  if(!nv||nv===old){render();return;}
  if(S.sections.includes(nv)){render();return;}
  S.sections[i]=nv;
  S.notes.forEach(n=>{if(n.section===old)n.section=nv;});
  save();render();
}

    h+=active.length?active.map(t=>'<button type="button" class="tag" aria-pressed="true" data-tag="'+esc(t.name)+'" data-id="'+n.id+'" data-sev="'+esc(t.sev)+'">'+esc(t.name)+' ×</button>').join("")

    '<div class="f narrow"><label for="ctSev">Weight</label><select class="inp" id="ctSev"><option value="minor">minor</option><option value="major">major</option></select></div>'+
    '<button type="button" class="btn sec sm" id="ctAdd" style="margin-bottom:0">Add tag</button>'+
    (S.customTags.length?'<div style="flex:1 1 100%;display:flex;gap:6px;flex-wrap:wrap;padding-top:4px">'+S.customTags.map(t=>'<span class="sevtag" data-s="'+esc(t.sev)+'">'+esc(t.name)+' <a href="#" data-rmtag="'+esc(t.name)+'" style="color:inherit">×</a></span>').join("")+'</div>':"")+
  '</div>'+
  '<div class="capture">'+
   '<div style="font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px">Add a second-read finding</div>'+
   '<div class="capture-row">'+
     '<div class="f"><label for="n2l">Line</label><input class="inp" id="n2l" type="number" min="1" placeholder="118" inputmode="numeric"></div>'+

  (S.notes.length?[...S.notes].sort((a,b)=>(parseInt(a.line)||99999)-(parseInt(b.line)||99999)).map(n=>{
    const s=sevOf(n);const core=isCore(n.id);
    return '<article class="note'+(s==="major"?" n-major":s==="minor"?" n-minor":"")+(n.status==="rejected"?" is-rejected":"")+(core?" is-core":"")+'" data-card="'+n.id+'">'+

        (s==='major'?'<span class="sevtag" data-s="major">MAJ</span>':s==='minor'?'<span class="sevtag" data-s="minor">MIN</span>':'<span class="sevtag" data-s="none">untagged</span>')+(core?'<span class="sevtag" data-s="none">★ CORE</span>':"")+'</div>'+
      '<div class="note-body"><p class="note-text clickable" data-edit="'+n.id+'" title="Click to edit">'+esc(n.text)+'</p>'+
        tagRow(n)+
        '<div class="note-meta"><div class="note-acts">'+
          '<button type="button" class="mark m-maj" aria-pressed="'+(sevOf(n)==="major"&&n.status!=="rejected")+'" data-sev-btn="major" data-id="'+n.id+'">Major</button>'+
          '<button type="button" class="mark m-min" aria-pressed="'+(sevOf(n)==="minor"&&n.status!=="rejected")+'" data-sev-btn="minor" data-id="'+n.id+'">Minor</button>'+

/* ---- 05 report ---- */
function groups(){
  const secs=sectionsList();
  const g={major:{},minor:{}};
  secs.forEach(s=>{g.major[s]=[];g.minor[s]=[];});
  const un=[];
  live().forEach(n=>{
    const s=sevOf(n);
    let sec=n.section||"General";
    /* keep notes whose section is no longer in the paper-sections list
       under their own bucket (e.g. legacy "General") instead of misfiling */
    if(!Object.prototype.hasOwnProperty.call(g.major,sec)){g.major[sec]=[];g.minor[sec]=[];}
    if(s==="major")g.major[sec].push(n);
    else if(s==="minor")g.minor[sec].push(n);
    else un.push(n);
  });
  return {g,un};
}

const POLISH_SYS=[

"Keep the reviewer's own voice and register. This is a signed scientific review, not a marketing document.",
"Return the improved report in the same Markdown structure: Intro, then Major concerns, then Minor points, each split by Introduction / Methods / Results / Discussion, then Letter to the editor, then Recommendation.",

function springerText(){
  const sp=S.springer||{};
  if(!sp.level||sp.level==="none")return sp.level==="none"?"No AI was used to prepare this review.":"AI-use declaration: not set.";
  const lbl=sp.level?sp.level[0].toUpperCase()+sp.level.slice(1):"";
  return "Springer Nature AI-use declaration ("+lbl+"): "+(sp.tool||"tool not named")+(sp.detail?" — "+sp.detail:"")+
    " [Source: Springer Nature, AI use in peer review, "+SPRINGER_URL+", accessed "+SPRINGER_ACCESSED+"]";
}
function draftText(){
  const {g}=groups();
  let t="# Peer-review report\n\nManuscript: "+(S.ms||"untitled")+"\n\n";
  t+="## Intro\n"+(S.report.intro||"")+"\n\n";
  const sec=(title,obj,sev)=>{
    let out="";
    const listed=sectionsList();
    const order=listed.concat(Object.keys(obj).filter(x=>!listed.includes(x)));
    order.forEach(s=>{const a=obj[s]||[],ai=aiConcerns(sev).filter(x=>aiSecOf(x.t)===s);
      if(!a.length&&!ai.length)return;
      out+="\n### "+s+"\n";let i=0;
      a.forEach(n=>{i++;const core=isCore(n.id);
        out+=i+". ["+(n.line?("L"+n.line):"General")+"] "+(core?"**CORE CONCERN — ":"")+n.text+(core?"**":"")+((n.tags||[]).length?" ("+n.tags.join(", ")+")":"")+"\n";});
      ai.forEach(({t:it,a:an})=>{i++;out+=i+". ["+(it.code||it.id)+" — score "+an.val+"] "+it.q+(an.note?" — "+an.note:"")+"\n";});
    });
    return out?("## "+title+"\n"+out):"";
  };

  t+=sec("Major concerns",g.major,"major");
  t+=sec("Minor points",g.minor,"minor");
  if(S.ai.on===false)t+="\n## AI checklist\nSkipped (optional).\n";
  else if(aiOn())t+="\n## AI checklist\nOnly scores 1–2 are listed above inside Major/Minor. Scores 3–5, Unclear and N/A are not exported. EQUATOR: "+EQUATOR_LIB+" (accessed "+EQUATOR_ACCESSED+").\n";
  t+="\n## Letter to the editor\n"+(S.report.letter||"")+"\n";
  t+="\nRecommendation: "+(S.rec||"—")+"\n";
  t+="\n## AI-use declaration\n"+springerText()+"\n";
  return t;
}
/* ---- .pltpy file: YAML frontmatter + Markdown + timestamped history + embedded state ---- */
function yamlEsc(v){return '"'+String(v==null?"":v).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g," ")+'"';}
function pltpyText(){
  const c=counters();
  const fm=["---",
   "format: pltpy",
   "pltpy_version: 1",
   "id: "+yamlEsc(S.id||""),
   "manuscript: "+yamlEsc(S.ms||"Untitled manuscript"),
   "created: "+yamlEsc(new Date(S.createdAt||Date.now()).toISOString()),
   "updated: "+yamlEsc(new Date(S.updatedAt||Date.now()).toISOString()),
   "step: "+(S.step||1),
   "recommendation: "+yamlEsc(S.rec||""),
   "sections: ["+sectionsList().map(s=>yamlEsc(s)).join(", ")+"]",
   "counts: {total: "+S.notes.length+", major: "+c.maj+", minor: "+c.min+", untagged: "+c.un+", rejected: "+c.rj+"}",
   "ai_checklist: "+(S.ai.on===true?"run":S.ai.on===false?"skipped":"not-opened"),
   "core_concerns: ["+(S.core||[]).map(id=>yamlEsc(id)).join(", ")+"]",
   "springer_ai_use: "+yamlEsc((S.springer||{}).level||""),
   "springer_ref: "+yamlEsc(SPRINGER_URL+" (accessed "+SPRINGER_ACCESSED+")"),
   "equator_ref: "+yamlEsc(EQUATOR_LIB+" (accessed "+EQUATOR_ACCESSED+")"),
   "history_events: "+((S.history||[]).length),
   "---"].join("\n");
  let md="\n# Peer-review report — "+(S.ms||"Untitled manuscript")+"\n\n";
  md+="Exported "+new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})+" · PlatyPeer (.pltpy)\n\n";
  md+=draftText()+"\n\n## All comments (timestamped version history)\n\n";
  const notes=[...S.notes].sort((a,b)=>(a.at||0)-(b.at||0));
  if(!notes.length)md+="_No comments saved._\n";
  else notes.forEach(n=>{
    const when=n.at?new Date(n.at).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"—";
    md+="- ["+when+"] ["+(n.line?("L"+n.line):"General")+"] ["+esc(n.section||"")+"] ["+(sevOf(n)||"untagged")+"]"+(isCore(n.id)?" [★ CORE]":"")+(n.status==="rejected"?" [struck]":"")+" "+String(n.text||"").replace(/\n/g," ")+"\n";
  });
  md+="\n## Event history\n\n";
  (S.history||[]).forEach(e=>{md+="- "+(e.t||"")+" · "+e.ev+(e.detail?" — "+e.detail:"")+"\n";});
  md+="\n```pltpy-state\n"+btoa(unescape(encodeURIComponent(JSON.stringify(S))))+"\n```\n";
  return fm+md;
}
function pltpyFileName(){
  const slug=(S.ms||"peer-review").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48)||"peer-review";
  return slug+".pltpy";
}
function savePltpy(){
  try{
    saveNow();logHist("Export .pltpy");saveNow();
    const blob=new Blob([pltpyText()],{type:"text/markdown;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=pltpyFileName();
    document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},400);
    hitEvent("txt","report_pltpy");
  }catch(e){openModal("Could not save","The .pltpy file could not be generated. Use Copy report instead.","OK",closeModal);}
}
function parsePltpy(text){
  const m=String(text||"").match(/```pltpy-state\s+([A-Za-z0-9+/=\s]+)\s*```/);
  if(!m)throw new Error("No embedded review state found — is this a .pltpy file exported by PlatyPeer?");
  const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s+/g,"")))));
  if(!j||typeof j!=="object"||!Array.isArray(j.notes))throw new Error("Unrecognised review state.");
  return j;
}
function promptText(){
  return "You are helping me polish a peer-review report I have written for a healthcare-AI manuscript.\n\n"+
  "Rules:\n"+
  "1. Do not add findings, facts, or claims I have not made.\n"+
  "2. Do not soften or strengthen any judgement, and do not delete any point.\n"+
  "3. Replace vague wording with the specific observation I already made.\n"+
  "4. Split any sentence carrying two separate criticisms.\n"+
  "5. Make each point's consequence explicit where it is still ambiguous.\n"+
  "6. Keep my voice. This is a signed scientific review, not marketing copy.\n"+
  "7. Return the report in the same Markdown structure, and nothing else — no preamble, no list of changes.\n\n"+
  "----- BEGIN MY REPORT -----\n\n"+draftText()+"\n----- END MY REPORT -----";
}

       '<div style="display:flex;gap:8px;flex-wrap:wrap"><select class="inp" id="pmodel" style="flex:1 1 220px">'+
       (p.models.length?p.models.map(m=>'<option'+(p.model===m?" selected":"")+'>'+esc(m)+'</option>').join(""):'<option value="">Fetch the endpoint\'s model list first</option>')+
       '</select><button type="button" class="btn sec sm" id="btn-fetch">Fetch models</button></div></div></div>'+
     '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px">'+
       '<button type="button" class="btn" id="btn-run">Polish the report</button>'+
       '<button type="button" class="btn gh sm" id="btn-forget">Forget the key</button>'+
     '</div>'+
     '<div class="pill-out" data-st="'+esc(p.state==="idle"?"":p.state)+'" id="pstatus" style="margin-top:14px"><span class="dot"></span><span id="pmsg">'+
       esc(p.msg||"Nothing sent yet.")+'</span></div>'+
     '<p style="font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin:12px 0 0;line-height:1.6">Gemini speaks the Gemini-compatible API; every other provider here speaks OpenAI-compatible. Custom endpoints can use either. The key is kept in this browser\'s local storage on this device and is sent nowhere except the base URL above. On a shared or clinical machine, use Forget the key when you are done.</p>'+
    '</div>';
    if(p.out)h+=compareBlock(p.out);
  }else if(p.route==="prompt"){
    h+='<div class="capture">'+
     '<div style="font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Ready-to-paste prompt</div>'+
     '<textarea class="prompt-out" id="pout" readonly>'+esc(promptText())+'</textarea>'+
     '<div style="display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap">'+
       '<button type="button" class="btn" id="btn-copyprompt">Copy prompt and report</button>'+
       '<span class="apitype-h">Generated locally — the prompt leaves this browser only when you paste it.</span>'+
     '</div></div>'+
     '<div class="capture" style="margin-top:18px">'+
       '<div style="font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Paste the polished result back</div>'+
       '<textarea class="inp" id="ppaste" rows="6" placeholder="Paste what the model returned, to compare it against your draft">'+esc(S.polish.pasted||"")+'</textarea>'+
       '<button type="button" class="btn sec sm" id="btn-compare" style="margin-top:10px">Compare</button></div>';
    if(p.out)h+=compareBlock(p.out);
  }else{
    h+='<div class="empty">The report stands on its own. Go back a step to copy it out or save it as a PDF.</div>';
  }
  return h;
}
function compareBlock(out){
  const d=draftText();
  const dw=d.trim().split(/\s+/).length, ow=out.trim().split(/\s+/).length;
  const dl=(d.match(/\[L\d+\]/g)||[]).length, ol=(out.match(/\[L\d+\]/g)||[]).length;
  return '<div class="rsect-h" style="margin-bottom:0"><span>Draft against polished</span><span class="marks">'+
   '<span class="'+(ow<dw?"up":"dn")+'">'+(ow-dw>=0?"+":"")+(ow-dw)+' words</span>'+
   '<span class="'+(ol>=dl?"up":"dn")+'">'+(ol-dl>=0?"+":"")+(ol-dl)+' line anchors</span></span></div>'+
   '<div class="compare">'+
   '<div class="cmp-col"><div class="cmp-h" data-k="draft"><span>Your draft</span><span>'+dw+' words</span></div><div class="cmp-b">'+esc(d)+'</div></div>'+
   '<div class="cmp-col"><div class="cmp-h" data-k="polished"><span>Polished</span><span>'+ow+' words</span></div><div class="cmp-b">'+esc(out)+'</div></div>'+
   '</div>'+
   '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px">'+
   '<button type="button" class="btn" id="btn-apply">Apply the polished report</button>'+
   '<button type="button" class="btn sec" id="btn-keep">Keep my draft</button>'+
   '<button type="button" class="btn gh sm" id="btn-copyout">Copy polished</button></div>'+
   '<div class="note-blk"><b>Nothing has been applied yet.</b> Applying replaces the intro and the letter, and rewrites each report point from the polished text — you can still edit every line afterwards in the report. Keeping your draft discards the polished version entirely.</div>';
}

function pstat(st,msg){const el=$("#pstatus");if(!el)return;el.setAttribute("data-st",st);$("#pmsg").textContent=msg;S.polish.state=st;S.polish.msg=msg;}
function copyText(t,btn,label){
  navigator.clipboard.writeText(t).then(()=>{
    const o=btn.textContent;btn.textContent="Copied ✓";setTimeout(()=>btn.textContent=o,1600);
  }).catch(()=>{
    const ta=document.createElement("textarea");ta.value=t;document.body.append(ta);ta.select();
    try{document.execCommand("copy");const o=btn.textContent;btn.textContent="Copied ✓";setTimeout(()=>btn.textContent=o,1600);}
    catch(e){btn.textContent="Copy failed";}
    ta.remove();});
}
function startEdit(el,id){
  const n=S.notes.find(x=>x.id===id);if(!n||el.querySelector("textarea,input"))return;
  const ta=document.createElement("textarea");ta.className="editbox";ta.rows=3;ta.value=n.text;
  el.textContent="";el.append(ta);ta.focus();ta.select();
  let done=false;
  const commit=ok=>{if(done)return;done=true;
    if(ok&&ta.value.trim()&&ta.value.trim()!==n.text){n.text=ta.value.trim();if(n.status!=="rejected"&&n.status!=="added")n.status="edited";n.editedAt=Date.now();logHist("Comment edited",(n.line?("L"+n.line+" "):"")+n.text.slice(0,80));}
    save();render();};
  ta.addEventListener("blur",()=>commit(true));
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))commit(true);if(e.key==="Escape"){done=true;render();}e.stopPropagation();});
  ta.addEventListener("click",e=>e.stopPropagation());
}
function startArea(el,k){
  if(el.querySelector("textarea"))return;
  const s=STEPS[S.step-1];
  const ta=document.createElement("textarea");ta.className="editbox";ta.rows=k==="intro"?4:3;
  ta.value=S.report[k]||"";
  ta.placeholder=k==="intro"?"What is this paper trying to do, and does it succeed?":"A short private note to the editor — the part the authors should not read.";
  el.textContent="";el.append(ta);ta.focus();
  let done=false;
  const commit=()=>{if(done)return;done=true;S.report[k]=ta.value.trim();save();render();};
  ta.addEventListener("blur",commit);
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))commit();if(e.key==="Escape"){done=true;render();}e.stopPropagation();});
  void s;
}

/* ---- polish networking (browser-direct, OpenAI-compatible) ---- */
function normBase(v){return String(v||"").trim().replace(/\/+$/,"");}
async function fetchModels(){
  const base=normBase(S.polish.base),key=String(S.polish.key||"").trim();
  if(!base){pstat("err","Name the API base URL first.");return;}
  if(!key){pstat("err","Enter your API key first.");return;}
  pstat("busy","Asking "+base+" for its model list…");save();
  try{
    if(S.polish.api==="gemini"){
      const r=await fetch(base+"/models?key="+encodeURIComponent(key),{headers:{"x-goog-api-key":key}});
      if(!r.ok){pstat("err","The endpoint answered "+r.status+". Check the base URL and the key.");save();return;}
      const j=await r.json();
      const ids=(j.models||[])
        .filter(m=>m&&(!m.supportedGenerationMethods||m.supportedGenerationMethods.includes("generateContent")))
        .map(m=>String(m.name||"").replace(/^models\//,"")).filter(Boolean).sort();
      if(!ids.length){pstat("err","The endpoint returned no models.");save();return;}
      S.polish.models=ids;S.polish.model=ids.includes(S.polish.model)?S.polish.model:ids[0];
      pstat("ok",ids.length+" models found. Choose one, then polish.");
      save();render();
      return;
    }
    const r=await fetch(base+"/models",{headers:{Authorization:"Bearer "+key}});
    if(!r.ok){pstat("err","The endpoint answered "+r.status+". Check the base URL and the key.");save();return;}
    const j=await r.json();
    const ids=(j.data||j.models||[]).map(m=>m&&(m.id||m.name)).filter(Boolean).sort();
    if(!ids.length){pstat("err","The endpoint returned no models.");save();return;}
    S.polish.models=ids;S.polish.model=ids.includes(S.polish.model)?S.polish.model:ids[0];
    pstat("ok",ids.length+" models found. Choose one, then polish.");
    save();render();
  }catch(e){
    pstat("err","The request did not complete — usually a wrong base URL or a blocked origin. "+String(e.message||""));save();
  }
}
async function runPolish(){
  const base=normBase(S.polish.base),key=String(S.polish.key||"").trim(),model=S.polish.model||"";
  if(!base||!key||!model){pstat("err","Base URL, key, and model all need to be set.");return;}
  pstat("busy","Sending your draft to "+model+"…");save();
  hitEvent("polish","polish_run");
  try{
    if(S.polish.api==="gemini"){
      const bare=model.replace(/^models\//,"");
      const r=await fetch(base+"/models/"+bare+":generateContent?key="+encodeURIComponent(key),{
        method:"POST",
        headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({
          system_instruction:{parts:[{text:POLISH_SYS}]},
          contents:[{role:"user",parts:[{text:draftText()}]}]})});
      if(!r.ok){const t=await r.text().catch(()=>"");pstat("err","The endpoint answered "+r.status+". "+t.slice(0,200));save();return;}
      const j=await r.json();
      const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const out=parts.map(x=>x&&x.text).filter(Boolean).join("\n");
      if(!out||!out.trim()){pstat("err","The endpoint returned an empty reply.");save();return;}
      S.polish.out=out.trim();pstat("ok","Polished version received. Compare it against your draft below, then decide.");save();render();
      return;
    }
    const body={model:model,messages:[{role:"system",content:POLISH_SYS},{role:"user",content:draftText()}],temperature:0.3};
    const r=await fetch(base+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},
      body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text().catch(()=>"");pstat("err","The endpoint answered "+r.status+". "+t.slice(0,200));save();return;}
    const j=await r.json();
    const out=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:"";
    if(!out||!out.trim()){pstat("err","The endpoint returned an empty reply.");save();return;}
    S.polish.out=out.trim();pstat("ok","Polished version received. Compare it against your draft below, then decide.");save();render();
  }catch(e){
    pstat("err","The request did not complete — usually a wrong base URL, a blocked origin, or no network. "+String(e.message||""));save();
  }
}
function applyPolished(){
  const out=String(S.polish.out||"");if(!out){return;}
  const grab=(re)=>{const m=out.match(re);return m?m[1].trim():"";};
  const intro=grab(/##\s*Intro\s*\n([\s\S]*?)(?=\n##|\n*$)/i);
  if(intro)S.report.intro=intro.replace(/^#+\s*/,"").trim();
  const letter=grab(/##\s*Letter to the editor\s*\n([\s\S]*?)(?=\n##|\n*$)/i);
  if(letter)S.report.letter=letter.trim();
  /* rewrite report points by line anchor, in order of appearance */
  const lines=[];const re=/\[L(\d+)\]\s*([^\n]+)/g;let m;
  while((m=re.exec(out))!==null)lines.push({line:m[1],text:m[2].trim()});
  live().forEach(n=>{
    const hit=lines.find(x=>String(x.line)===String(n.line));
    if(hit&&hit.text)n.text=hit.text.replace(/\s*\([^)]*\)\s*$/,"").trim();
  });
  S.polish.out="";save();render();
  openModal("Applied","The polished text is now in the report. Every line is still editable there, so read it through before you submit.","Open the report",()=>{closeModal();go(5);});
}

/* ---- export: TXT and PDF download (the sheet, no print dialog) ---- */
function reportFileName(ext){
  const slug=(S.ms||"peer-review").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48)||"peer-review";
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return slug+"-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"."+ext;
}
function saveTxt(){
  const t=draftText()+"\nGenerated: "+new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})+" · PlatyPeer\n";
  try{
    const blob=new Blob([t],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=reportFileName("txt");
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},400);
    hitEvent("txt","report_txt");
  }catch(e){
    openModal("Could not save","The text file could not be generated in this browser. Use Copy report instead.","OK",closeModal);
  }
}
/* ---- PDF fonts: embed Geist / Geist Mono so the export matches the design
   and renders in every viewer (base-14 fonts are missing on many systems) ---- */
const PDF_FONTS=["Geist-Regular.ttf","Geist-Bold.ttf","GeistMono-Regular.ttf","GeistMono-Bold.ttf"];
let pdfFontBins=null,pdfFontsPromise=null;
function preloadPdfFonts(){
  if(pdfFontsPromise)return pdfFontsPromise;
  pdfFontsPromise=Promise.all(PDF_FONTS.map(async f=>{
    const r=await fetch("assets/pdf-fonts/"+f);if(!r.ok)throw new Error(f);
    const b=new Uint8Array(await r.arrayBuffer());let s="";
    for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
    return [f,s];
  })).then(pairs=>{pdfFontBins=Object.fromEntries(pairs);return pdfFontBins;})
    .catch(()=>{pdfFontBins=null;return null;});
  return pdfFontsPromise;
}
preloadPdfFonts();
async function savePdf(){
  if(!window.jspdf||!window.jspdf.jsPDF){
    openModal("PDF library missing","The PDF library did not load (assets/jspdf.umd.min.js). Use Copy report or Save as TXT meanwhile.","OK",closeModal);return;}
  try{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  /* register the embedded faces over the base-14 names the layout code uses */
  await preloadPdfFonts();
  if(pdfFontBins){
    [["Geist-Regular.ttf","helvetica","normal"],["Geist-Bold.ttf","helvetica","bold"],
     ["Geist-Regular.ttf","helvetica","italic"],["GeistMono-Regular.ttf","courier","normal"],
     ["GeistMono-Bold.ttf","courier","bold"]].forEach(([f,fam,sty])=>{
      try{doc.addFileToVFS(f,pdfFontBins[f]);doc.addFont(f,fam,sty);}catch(e){}});
  }
  const W=210,H=297,ML=12,MR=12,MT=14,MB=14,CW=W-ML-MR;
  const C={ultra:[27,47,208],ink:[20,23,26],ink2:[67,71,76],ink3:[107,112,117],
    rule:[211,214,208],hair:[227,229,224],paper2:[235,235,230],
    major:[200,54,31],majorW:[251,237,234],minor:[154,107,0],minorW:[251,243,224],
    ok:[31,107,69],ai:[91,62,155],white:[255,255,255]};
  const setF=c=>doc.setTextColor(c[0],c[1],c[2]);
  const setFill=c=>doc.setFillColor(c[0],c[1],c[2]);
  const setD=c=>doc.setDrawColor(c[0],c[1],c[2]);
  const BOTTOM=H-MB-7;
  let y=MT;
  function footer(){
    setD(C.hair);doc.setLineWidth(.2);doc.line(ML,H-MB-4,W-MR,H-MB-4);
    doc.setFont("courier","normal");doc.setFontSize(7);setF(C.ink3);
    doc.text("PlatyPeer",ML,H-MB-1.5,{charSpace:.4});
    doc.text("PAGE "+doc.getCurrentPageInfo().pageNumber,W-MR,H-MB-1.5,{align:"right",charSpace:.4});
  }
  function newPage(){
    footer();doc.addPage();
    doc.setFont("helvetica","bold");doc.setFontSize(8);setF(C.ink3);
    doc.text("PEER-REVIEW REPORT — CONTINUED",ML,MT,{charSpace:.5});
    doc.setFont("courier","normal");doc.setFontSize(7.5);
    doc.text(String(S.ms||"Untitled manuscript").slice(0,90),W-MR,MT,{align:"right"});
    setD(C.rule);doc.setLineWidth(.3);doc.line(ML,MT+3,W-MR,MT+3);
    y=MT+8;
  }
  const need=h=>{if(y+h>BOTTOM)newPage();};
  function sectHead(title,tint,rightLabel){
    need(16);
    const bg=tint==="major"?C.majorW:tint==="minor"?C.minorW:C.paper2;
    const fg=tint==="major"?C.major:tint==="minor"?C.minor:C.ink;
    setFill(bg);setD(fg);doc.setLineWidth(.7);
    const top=y;
    doc.rect(ML,top,CW,6.6,"F");
    doc.line(ML,top+6.6,W-MR,top+6.6);
    doc.setFont("courier","bold");doc.setFontSize(8);setF(fg);
    doc.text(title.toUpperCase(),ML+2.5,top+4.5,{charSpace:.7});
    if(rightLabel)doc.text(rightLabel.toUpperCase(),W-MR-2.5,top+4.5,{align:"right",charSpace:.7});
    y=top+11;
  }
  function subHead(s){
    need(10);
    doc.setFont("helvetica","bold");doc.setFontSize(7.5);setF(C.ink2);
    doc.text(String(s).toUpperCase(),ML,y,{charSpace:.4});
    y+=1.8;
    setD(C.hair);doc.setLineWidth(.15);doc.line(ML,y,W-MR,y);
    y+=3.2;
  }
  function point(refMain,refSub,text,ai,sev,bold){
    const rw=19,gap=3,tx=ML+rw+gap,tw=CW-rw-gap-(sev?13:0);
    doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(9);
    const label=bold?"★ CORE — ":"";
    const tLines=text?doc.splitTextToSize(label+String(text),tw):[""];
    doc.setFont("courier","normal");doc.setFontSize(7);
    const sLines=refSub?doc.splitTextToSize(String(refSub),rw):[];
    const blockH=Math.max(tLines.length*4.1,3.4+sLines.length*3.1)+3.4;
    need(blockH+4);
    const top=y;
    doc.setFont("courier","bold");doc.setFontSize(7.5);setF(C.ink);
    doc.text(String(refMain),ML,top+3.4);
    doc.setFont("courier","normal");doc.setFontSize(7);setF(ai?C.ai:C.ink3);
    sLines.forEach((ln,i)=>doc.text(ln,ML,top+3.4+(i+1)*3.1));
    setD(C.hair);doc.setLineWidth(.15);
    doc.line(ML+rw,top+0.5,ML+rw,top+blockH-1.5);
    doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(9);setF(C.ink);
    tLines.forEach((ln,i)=>doc.text(ln,tx,top+3.6+i*4.1));
    if(sev){ /* severity never alone: solid block + literal code */
      const code=sev==="major"?"MAJ":"MIN";
      const col=sev==="major"?C.major:C.minor;
      doc.setFont("courier","bold");doc.setFontSize(7.5);
      const cw=doc.getTextWidth(code)+2.6;
      const cx=W-MR-cw,cy=top+0.3;
      setFill(col);doc.rect(cx,cy,cw,4.6,"F");
      setF(C.white);doc.text(code,cx+1.3,cy+3.3);
    }
    y=top+blockH;
    setD(C.hair);doc.setLineWidth(.15);doc.line(ML,y,W-MR,y);
  }
  function recRow(){
    need(24);
    const recs=[["accept","Accept","As it stands"],["minor","Minor revision","Fixable at revision"],
      ["major","Major revision","Substantive rework"],["reject","Reject","Not salvageable"]];
    const cw=CW/4,ch=16,top=y;
    recs.forEach((r,i)=>{
      const x=ML+i*cw,on=S.rec===r[0];
      if(on){setFill(C.ink);setD(C.ink);doc.rect(x,top,cw,ch,"FD");setF(C.white);}
      else{setFill(C.white);setD(C.rule);doc.rect(x,top,cw,ch,"FD");setF(C.ink);}
      doc.setFont("helvetica","bold");doc.setFontSize(9.5);
      doc.text(r[1],x+2.5,top+6.5);
      doc.setFont("courier","normal");doc.setFontSize(6.5);
      setF(on?[157,162,168]:C.ink3);
      doc.text(r[2].toUpperCase(),x+2.5,top+11.5,{charSpace:.3});
    });
    setD(C.ink);doc.setLineWidth(.4);doc.rect(ML,top,CW,ch,"S");
    y=top+ch+5;
  }
  /* full-bleed ultramarine band — the sheet's head, as on screen */
  const REC_NAME={accept:"ACCEPT",minor:"MINOR REVISION",major:"MAJOR REVISION",reject:"REJECT"};
  setFill(C.ultra);doc.rect(0,0,W,11,"F");
  doc.setFont("courier","bold");doc.setFontSize(8);setF(C.white);
  doc.text("PEER-REVIEW REPORT",ML,7,{charSpace:.7});
  doc.text(String(REC_NAME[S.rec]||"NO RECOMMENDATION SET"),W-MR,7,{align:"right",charSpace:.7});
  y=MT+6;
  doc.setFont("helvetica","bold");doc.setFontSize(21);setF(C.ink);
  doc.text("Peer-review report",ML,y);y+=9;
  doc.setFont("courier","normal");doc.setFontSize(8);setF(C.ink3);
  doc.text(String(S.ms||"Untitled manuscript")+"  ·  "+(aiOn()?"AI CHECKLIST RUN":"NO AI CHECKLIST"),ML,y,{charSpace:.3});
  y+=3;
  setD(C.rule);doc.setLineWidth(.3);doc.line(ML,y,W-MR,y);y+=7;
  const {g}=groups();
  sectHead("Overall impression",null);
  if(S.report.intro){
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);setF(C.ink);
    doc.splitTextToSize(S.report.intro,CW).forEach(ln=>{need(4.5);doc.text(ln,ML,y);y+=4.3;});
  }else{
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);setF(C.ink3);
    doc.text("No overall impression written.",ML,y);y+=5;
  }
  y+=4;
  const block=(title,sev,obj)=>{
    let any=false;
    const listed=sectionsList();
    const order=listed.concat(Object.keys(obj).filter(x=>!listed.includes(x)));
    order.forEach(sec=>{
      const arr=obj[sec]||[],ai=aiConcerns(sev).filter(x=>aiSecOf(x.t)===sec);
      if(!arr.length&&!ai.length)return;
      if(!any){sectHead(title,sev,sev);any=true;}
      need(12);subHead(sec);
      arr.forEach(n=>point(lineLabel(n),(n.section||"")+(isCore(n.id)?" ★CORE":""),n.text,false,sev,isCore(n.id)));
      /* only scores 1–2 (No-equivalent) reach the PDF, merged here — never a separate AI section */
      ai.forEach(({t,a})=>point(t.code||t.id,"SCORE "+a.val,t.q+(a.note?" — "+a.note:""),true,sev));
    });
  };
  block("Major concerns","major",g.major);
  block("Minor points","minor",g.minor);
  /* No "checks passed" section: Yes-equivalent scores (4–5) stay out of the PDF by design. */
  sectHead("AI-use declaration — Springer Nature",null);
  doc.splitTextToSize(springerText(),CW).forEach(ln=>{need(4.5);doc.setFont("helvetica","normal");doc.setFontSize(8.5);setF(C.ink2);doc.text(ln,ML,y);y+=4.1;});
  y+=3;
  if(aiOn()){
    doc.splitTextToSize("EQUATOR: "+EQUATOR_LIB+" (accessed "+EQUATOR_ACCESSED+")",CW).forEach(ln=>{need(4.5);doc.setFont("courier","normal");doc.setFontSize(7);setF(C.ink3);doc.text(ln,ML,y);y+=3.8;});
    y+=3;
  }
  /* Recommendation. The letter to the editor is deliberately not in the PDF. */
  sectHead("Recommendation",null);
  recRow();
  footer();
  hitEvent("pdf","report_pdf");
  doc.save(reportFileName("pdf"));
  }catch(e){
    openModal("PDF failed","The PDF could not be generated: "+String((e&&e.message)||e).slice(0,160),"OK",closeModal);
  }
}

/* ---- nav, glossary, stats, reset ---- */
function go(n){S.step=Math.min(6,Math.max(1,n));save();render();
  try{const F=$("#field");const y=F.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y,behavior:"smooth"});}catch(e){}}
function openGlossary(){
  openModal("AI Glossary",
   "<div class='f'><label for='gq'>Search terms</label><input class='inp' id='gq' placeholder='e.g. leakage, calibration, bias' autocomplete='off'></div>"+
   "<div class='gloss-list' id='glist'>"+GLOSSARY.map(g=>"<div class='gloss' data-g><p class='gloss-term'>"+esc(g[0])+"</p><p class='gloss-def'>"+esc(g[1])+"</p></div>").join("")+"</div>",
   "Done",closeModal);
  const q=$("#gq");
  if(q){q.addEventListener("input",()=>{const s=q.value.toLowerCase();
    document.querySelectorAll("#mbody [data-g]").forEach(d=>{d.hidden=s&&d.textContent.toLowerCase().indexOf(s)<0;});});
    setTimeout(()=>q.focus(),60);}
}
$("#ms").value=S.ms||"";
$("#ms").addEventListener("input",e=>{S.ms=e.target.value;save();});
$("#btn-prev").addEventListener("click",()=>go(S.step-1));
$("#btn-next").addEventListener("click",()=>go(S.step+1));
$("#btn-gloss").addEventListener("click",openGlossary);
/* ---- reviews library: New / Continue / Export / Import .pltpy ---- */
function openReviews(){
  const lib=readLib();
  const ids=Object.keys(lib).sort((a,b)=>((lib[b]||{}).updatedAt||0)-((lib[a]||{}).updatedAt||0));
  const rows=ids.length?ids.map(id=>{
    const r=lib[id]||{};const n=(r.notes||[]).length;
    const when=r.updatedAt?new Date(r.updatedAt).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"—";
    return '<div class="revrow"><div class="rm"><b>'+esc(r.ms||"Untitled manuscript")+'</b><span>'+n+' comments · updated '+esc(when)+(id===S.id?" · current":"")+'</span></div>'+
    '<button type="button" class="btn sec sm" data-openrev="'+id+'">Continue</button>'+
    '<button type="button" class="btn gh sm" data-delrev="'+id+'">Delete</button></div>';
  }).join(""):'<div class="empty">No saved reviews on this device yet.</div>';
  openModal("My reviews — continue on this device",
    "<p style='margin:0;font-size:13.5px;color:var(--ink-2)'>Reviews are stored in this browser. Continue one, export it as a <b>.pltpy</b> file (YAML frontmatter + Markdown + timestamped history), or import a .pltpy to continue elsewhere.</p>"+
    "<div class='revlist'>"+rows+"</div>"+
    "<div style='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap'><button type='button' class='btn sec sm' id='m-export'>Export current .pltpy</button><button type='button' class='btn sec sm' id='m-import'>Import .pltpy</button></div>",
    "Close",closeModal);
  document.querySelectorAll("[data-openrev]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.getAttribute("data-openrev");const lib2=readLib();
    if(!lib2[id])return;
    saveNow();
    const bb=base();S=Object.assign(bb,lib2[id]);
    S.invite=Object.assign(base().invite,lib2[id].invite||{});
    S.ai=Object.assign({on:null,ans:{}},lib2[id].ai||{});
    S.report=Object.assign({intro:"",letter:""},lib2[id].report||{});
    S.polish=Object.assign(base().polish,lib2[id].polish||{});
    S.springer=Object.assign({level:"",tool:"",detail:""},lib2[id].springer||{});
    if(!Array.isArray(S.core))S.core=[];if(!Array.isArray(S.history))S.history=[];
    logHist("Review reopened");$("#ms").value=S.ms||"";
    saveNow();closeModal();render();go(S.step||1);
  }));
  document.querySelectorAll("[data-delrev]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.getAttribute("data-delrev");
    const lib2=readLib();delete lib2[id];
    try{localStorage.setItem(LIB_KEY,JSON.stringify(lib2));}catch(e){}
    if(id===S.id){S=base();$("#ms").value="";saveNow();}
    closeModal();render();
  }));
  const me=$("#m-export");if(me)me.addEventListener("click",()=>{closeModal();savePltpy();});
  const mi=$("#m-import");if(mi)mi.addEventListener("click",()=>{closeModal();$("#file-import").click();});
}
const newReview=()=>{
  openModal("Start a new review?","<p style='margin:0;font-size:13.5px;color:var(--ink-2)'>The current review stays saved on this device under <b>My reviews</b>. A fresh review will open at step 1.</p>","Start new",()=>{
    saveNow();S=base();logHist("Review created");$("#ms").value="";saveNow();closeModal();render();go(1);});
};
$("#btn-new").addEventListener("click",newReview);
$("#btn-open").addEventListener("click",openReviews);
$("#btn-export").addEventListener("click",savePltpy);
$("#btn-import").addEventListener("click",()=>$("#file-import").click());
$("#file-import").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=parsePltpy(String(rd.result||""));
      saveNow();
      const bb=base();S=Object.assign(bb,j);
      S.invite=Object.assign(base().invite,j.invite||{});
      S.ai=Object.assign({on:null,ans:{}},j.ai||{});
      S.report=Object.assign({intro:"",letter:""},j.report||{});
      S.polish=Object.assign(base().polish,j.polish||{});
      S.springer=Object.assign({level:"",tool:"",detail:""},j.springer||{});
      if(!Array.isArray(S.core))S.core=[];if(!Array.isArray(S.history))S.history=[];
      if(!S.id)S.id=uid();
      logHist("Imported .pltpy",f.name);$("#ms").value=S.ms||"";
      saveNow();render();go(S.step||1);
      openModal("Imported","Continuing <b>"+esc(S.ms||"review")+"</b> with full timestamped history ("+(S.history||[]).length+" events).","Open",()=>{closeModal();});
    }catch(err){openModal("Import failed",esc(String((err&&err.message)||err)),"OK",closeModal);}
    e.target.value="";
  };
  rd.readAsText(f);
});
$("#btn-reset").addEventListener("click",()=>{
  openModal("Clear this review?",
    "<p style='margin:0 0 6px;font-size:13.5px;color:var(--ink-2)'>This clears the readings, tags, checklist answers, report, and polish settings held in this browser. It cannot be undone.</p>"+
    "<div class='f' style='margin-top:14px'><label for='delph'>Type <b style='color:var(--major)'>DELETE</b> to confirm</label>"+
    "<input class='inp' id='delph' autocomplete='off' spellcheck='false' placeholder='DELETE'></div>",
    "Clear everything",()=>{
      const v=String(($("#delph")||{}).value||"").trim().toUpperCase();
      if(v!=="DELETE"){const d=$("#delph");if(d){d.focus();d.style.borderColor="var(--major)";}return;}
      S=base();try{localStorage.removeItem(KEY);}catch(e){}
      $("#ms").value="";save();render();closeModal();go(1);});
  const dph=$("#delph");
  if(dph){
    $("#mconfirm").disabled=true;
    dph.addEventListener("input",()=>{$("#mconfirm").disabled=dph.value.trim().toUpperCase()!=="DELETE";});
    setTimeout(()=>dph.focus(),50);
  }});

/* heal any legacy api/provider mismatch: a preset provider always owns its dialect */
{
  const pr=PROVIDERS.find(x=>x.id===S.polish.provider);
  if(pr){
    if(normBase(S.polish.base)!==pr.base)S.polish.provider="";
    else S.polish.api=pr.api;
  }
}
render();save();loadTpl();statVisit();
})();
